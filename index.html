<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研究体験ページ</title>
<style>
  /* ===== 色（好きな色に変えてOK） ===== */
  :root {
    --main: #1f6feb;
    --bg: #f3f5f9;
    --card: #ffffff;
    --text: #1d2330;
    --sub: #5b6475;
    --line: #e1e5ec;
    --ok: #1a7f37;
    --ok-bg: #e6f4ea;
    --ng: #cf222e;
    --ng-bg: #fdecec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  header { background: var(--main); color: #fff; padding: 28px 16px 24px; }
  header .inner, main { max-width: 560px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; line-height: 1.4; }
  header p { margin: 6px 0 0; font-size: 14px; opacity: .9; }
  main { padding: 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .tag { display: inline-block; background: var(--main); color: #fff; font-size: 12px; font-weight: bold; padding: 2px 10px; border-radius: 999px; }
  h2 { font-size: 18px; margin: 8px 0 4px; }
  .note { color: var(--sub); font-size: 14px; margin: 0 0 12px; }

  /* 体験 */
  .result { text-align: center; margin: 8px 0 4px; }
  .result .label { font-size: 14px; color: var(--sub); }
  .result .value { font-size: 44px; font-weight: bold; color: var(--main); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .result .value small { font-size: 18px; margin-left: 4px; }
  .bar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0 16px; }
  .bar div { height: 100%; width: 0; background: var(--main); border-radius: 999px; transition: width .15s; }
  .slider-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--sub); }
  .slider-row b { color: var(--text); font-size: 16px; }
  input[type=range] { width: 100%; height: 36px; accent-color: var(--main); margin: 4px 0 12px; }
  canvas { width: 100%; height: 200px; display: block; }

  /* クイズ */
  .q { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .q:first-of-type { margin-top: 8px; padding-top: 0; border-top: none; }
  .q p { font-weight: bold; margin: 0 0 8px; }
  .choice { display: block; width: 100%; text-align: left; font: inherit; font-size: 16px; padding: 12px 14px; margin: 6px 0; border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); cursor: pointer; }
  .choice:disabled { cursor: default; }
  .choice.ok { border-color: var(--ok); background: var(--ok-bg); }
  .choice.ng { border-color: var(--ng); background: var(--ng-bg); }
  .explain { display: none; font-size: 14px; background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
  .explain.show { display: block; }
  .score { display: none; text-align: center; font-size: 18px; font-weight: bold; margin-top: 16px; }
  .score.show { display: block; }
  footer { text-align: center; font-size: 12px; color: var(--sub); padding: 8px 16px 32px; }
</style>
</head>
<body>

<!-- ===== タイトル（ここを書き換える） ===== -->
<header>
  <div class="inner">
    <h1>距離で変わる電波の強さ</h1>
    <p>○○研究室　氏名</p>
  </div>
</header>

<main>
  <!-- ===== 体験 1：スライダー ===== -->
  <section class="card">
    <span class="tag">体験 1</span>
    <h2>スライダーを動かしてみよう</h2>
    <p class="note">スマホと Wi-Fi ルーターの距離を変えると、電波の強さはどう変わるでしょう？</p>

    <div class="result">
      <div class="label" id="resultLabel"></div>
      <div class="value"><span id="resultValue">0</span><small id="resultUnit"></small></div>
    </div>
    <div class="bar"><div id="resultBar"></div></div>

    <div class="slider-row"><span id="inputLabel"></span><b id="inputValue"></b></div>
    <input type="range" id="slider">

    <canvas id="graph"></canvas>
  </section>

  <!-- ===== 体験 2：クイズ ===== -->
  <section class="card">
    <span class="tag">体験 2</span>
    <h2>クイズに挑戦</h2>
    <div id="quiz"></div>
    <div class="score" id="score"></div>
  </section>

  <!-- ===== まとめ（ここを書き換える） ===== -->
  <section class="card">
    <span class="tag">まとめ</span>
    <h2>この研究でわかったこと</h2>
    <p>ここに研究の要点を 2〜3 行で書きます。詳しくはポスターで説明しているので、気軽に声をかけてください。</p>
  </section>
</main>

<footer>○○学会 ポスター発表</footer>

<script>
// ===== 体験 1 の設定（ここを書き換えると中身が変わります） =====
const EXPERIMENT = {
  inputLabel: "距離",
  inputUnit: "m",
  min: 1, max: 10, step: 0.5, initial: 1,
  resultLabel: "電波の強さ（1m のときを 100% とする）",
  resultUnit: "%",
  resultMax: 100,                // バーとグラフの最大値
  model: x => 100 / (x * x),     // 入力 x から結果を計算する式
};

// ===== クイズ（問題を増やすときは { ... } をコピーして追加） =====
const QUIZ = [
  {
    question: "距離が 2 倍になると、電波の強さはどうなる？",
    choices: ["1/2 になる", "1/4 になる", "変わらない"],
    answer: 1,   // 正解の番号（0 から数える）
    explain: "電波の強さは距離の 2 乗に反比例します。2 倍離れると 1/(2×2) = 1/4 です。",
  },
  {
    question: "スマホとルーターの間に人が立つと、電波はどうなる？",
    choices: ["強くなる", "弱くなる", "変わらない"],
    answer: 1,
    explain: "人の体は水分が多く、電波を吸収するので弱くなります。",
  },
];

// ===== ここから下は基本的に触らなくてOK =====
const $ = id => document.getElementById(id);

// --- 体験 1 ---
const slider = $("slider");
slider.min = EXPERIMENT.min;
slider.max = EXPERIMENT.max;
slider.step = EXPERIMENT.step;
slider.value = EXPERIMENT.initial;
$("inputLabel").textContent = EXPERIMENT.inputLabel;
$("resultLabel").textContent = EXPERIMENT.resultLabel;
$("resultUnit").textContent = EXPERIMENT.resultUnit;

function format(v) {
  return v >= 10 ? v.toFixed(0) : v.toFixed(1);
}

function update() {
  const x = Number(slider.value);
  const y = EXPERIMENT.model(x);
  $("inputValue").textContent = x + " " + EXPERIMENT.inputUnit;
  $("resultValue").textContent = format(y);
  $("resultBar").style.width = Math.min(100, y / EXPERIMENT.resultMax * 100) + "%";
  drawGraph(x);
}

const canvas = $("graph");
const ctx = canvas.getContext("2d");

function drawGraph(current) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const { min, max, resultMax, model, inputUnit } = EXPERIMENT;
  const pad = { l: 36, r: 12, t: 12, b: 28 };
  const px = x => pad.l + (x - min) / (max - min) * (w - pad.l - pad.r);
  const py = y => h - pad.b - Math.min(y, resultMax) / resultMax * (h - pad.t - pad.b);
  const css = getComputedStyle(document.documentElement);
  const mainColor = css.getPropertyValue("--main").trim();

  // 軸
  ctx.strokeStyle = css.getPropertyValue("--line").trim();
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t);
  ctx.lineTo(pad.l, h - pad.b);
  ctx.lineTo(w - pad.r, h - pad.b);
  ctx.stroke();

  // 目盛りの文字
  ctx.fillStyle = css.getPropertyValue("--sub").trim();
  ctx.font = "12px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(min + inputUnit, pad.l, h - 8);
  ctx.textAlign = "right";
  ctx.fillText(max + inputUnit, w - pad.r, h - 8);
  ctx.fillText(resultMax, pad.l - 6, pad.t + 10);
  ctx.fillText(0, pad.l - 6, h - pad.b);

  // 曲線
  ctx.strokeStyle = mainColor;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i <= 100; i++) {
    const x = min + (max - min) * i / 100;
    if (i === 0) ctx.moveTo(px(x), py(model(x)));
    else ctx.lineTo(px(x), py(model(x)));
  }
  ctx.stroke();

  // 今の位置
  ctx.fillStyle = mainColor;
  ctx.beginPath();
  ctx.arc(px(current), py(model(current)), 7, 0, Math.PI * 2);
  ctx.fill();
}

slider.addEventListener("input", update);
window.addEventListener("resize", update);
update();

// --- 体験 2：クイズ ---
let answered = 0, correct = 0;

QUIZ.forEach((item, qi) => {
  const box = document.createElement("div");
  box.className = "q";

  const p = document.createElement("p");
  p.textContent = "Q" + (qi + 1) + ". " + item.question;
  box.appendChild(p);

  const explain = document.createElement("div");
  explain.className = "explain";

  const buttons = item.choices.map((text, ci) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = text;
    b.addEventListener("click", () => {
      buttons.forEach(btn => btn.disabled = true);
      buttons[item.answer].classList.add("ok");
      if (ci === item.answer) correct++;
      else b.classList.add("ng");
      explain.textContent = (ci === item.answer ? "正解！ " : "残念… ") + item.explain;
      explain.classList.add("show");

      answered++;
      if (answered === QUIZ.length) {
        $("score").textContent = QUIZ.length + " 問中 " + correct + " 問正解！";
        $("score").classList.add("show");
      }
    });
    box.appendChild(b);
    return b;
  });

  box.appendChild(explain);
  $("quiz").appendChild(box);
});
</script>
</body>
</html>
